<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>I am sorry.</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{color:#f5f2ed;font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}button{font:inherit}.experience{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:#000}.scene{position:absolute;inset:0}#apology{z-index:2;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#000;transition:opacity 1.4s cubic-bezier(.55,0,.3,1),transform 1.4s cubic-bezier(.55,0,.3,1)}.apology-copy{text-align:center;transform:translateY(-2vh)}.apology-copy p{margin:0;opacity:0}.line-one{font-size:clamp(2.15rem,10vw,5.2rem);font-weight:400;line-height:1.08;letter-spacing:-.035em;animation:quiet-in 1.7s .25s cubic-bezier(.22,.65,.32,1) forwards}.line-two{margin-top:.6rem!important;font-size:clamp(1.35rem,5.8vw,2.75rem);line-height:1.35;color:#ddd9d2;animation:quiet-in 1.7s 1.35s cubic-bezier(.22,.65,.32,1) forwards}#enter{min-width:132px;min-height:48px;margin-top:clamp(2.4rem,8vh,4.2rem);padding:12px 18px;border:0;background:transparent;color:#aaa6a0;font-size:.82rem;letter-spacing:.16em;cursor:pointer;opacity:0;animation:quiet-in 1.4s 2.65s ease forwards,breathe 3.4s 4.1s ease-in-out infinite}#enter:focus-visible{outline:1px solid #ddd8cf;outline-offset:4px}#enter:disabled{cursor:default}#apology.leaving{opacity:0;transform:translateY(-3vh);pointer-events:none}@keyframes quiet-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes breathe{0%,100%{opacity:.48}50%{opacity:.92}}#garden{z-index:1;opacity:0;transform:translateY(4vh) scale(1.015);background:#000;transition:opacity 1.7s cubic-bezier(.55,0,.25,1),transform 2.1s cubic-bezier(.2,.65,.25,1);pointer-events:none}#garden.visible{opacity:1;transform:translateY(0) scale(1)}#garden-svg{width:100%;height:100%;display:block;overflow:visible}.stem{fill:none;stroke-linecap:round}.leaf,.petal{transform-box:fill-box;transform-origin:50% 100%}.central-wind,.extra-wind{transform-box:view-box;transform-origin:50% 100%}.garden-alive .central-wind{animation:central-sway 7.2s ease-in-out infinite alternate}.garden-alive .extra-wind{animation:flower-sway var(--wind-time) ease-in-out var(--wind-delay) infinite alternate}.garden-alive .extra-leaf{animation:leaf-whisper var(--leaf-time) ease-in-out var(--wind-delay) infinite alternate}.garden-alive .extra-petal{animation:petal-breathe calc(var(--wind-time)*.72) ease-in-out var(--wind-delay) infinite alternate}@keyframes central-sway{from{transform:rotate(-.8deg)}to{transform:rotate(1.15deg)}}@keyframes flower-sway{from{transform:rotate(var(--sway-neg))}to{transform:rotate(var(--sway))}}@keyframes leaf-whisper{from{transform:rotate(-.8deg)}to{transform:rotate(1.5deg)}}@keyframes petal-breathe{from{transform:rotate(-.25deg) scaleX(.998)}to{transform:rotate(.3deg) scaleX(1.006)}}.ground-point{opacity:0}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:700px){#garden-svg{width:min(100%,1500px);margin-inline:auto}.apology-copy{transform:translateY(-3vh)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="experience" aria-live="polite">
<section id="apology" class="scene" aria-label="Apology"><div class="apology-copy"><p class="line-one">I am sorry.</p><p class="line-two">Please माफ कर दो.</p><button id="enter" type="button" aria-controls="garden">please click me</button></div></section>
<section id="garden" class="scene" aria-label="A tulip garden growing in the dark" aria-hidden="true">
<svg id="garden-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice" role="img" aria-labelledby="garden-title garden-desc">
<title id="garden-title">A living garden of tulips</title><desc id="garden-desc">A central red and gold tulip grows, followed by pink and red tulips moving in a gentle breeze.</desc>
<defs>
<linearGradient id="stemLight" x1="0" x2="1"><stop offset="0" stop-color="#183820"/><stop offset=".42" stop-color="#4f7d43"/><stop offset=".72" stop-color="#7ca064"/><stop offset="1" stop-color="#24482b"/></linearGradient>
<linearGradient id="leafLight" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#102b1a"/><stop offset=".42" stop-color="#376b38"/><stop offset=".68" stop-color="#6c8f52"/><stop offset="1" stop-color="#193b23"/></linearGradient>
<linearGradient id="redGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b748"/><stop offset=".16" stop-color="#c83a2c"/><stop offset=".55" stop-color="#791b20"/><stop offset="1" stop-color="#26090d"/></linearGradient>
<linearGradient id="redDeep" x1="0" x2="1"><stop offset="0" stop-color="#3b0a10"/><stop offset=".43" stop-color="#a82927"/><stop offset=".7" stop-color="#d55b36"/><stop offset="1" stop-color="#4a0e17"/></linearGradient>
<linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd271"/><stop offset=".22" stop-color="#db7040"/><stop offset="1" stop-color="#6f1319"/></linearGradient>
<radialGradient id="pinkPetal" cx="55%" cy="26%" r="78%"><stop offset="0" stop-color="#f6b3b6"/><stop offset=".38" stop-color="#df6578"/><stop offset=".78" stop-color="#942f50"/><stop offset="1" stop-color="#451329"/></radialGradient>
<radialGradient id="pinkPale" cx="48%" cy="22%" r="82%"><stop offset="0" stop-color="#ffd3ce"/><stop offset=".5" stop-color="#ec8f99"/><stop offset="1" stop-color="#7a2945"/></radialGradient>
<filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".65"/></filter>
<filter id="softLight" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
</defs>
<g id="background-flowers"></g><g id="central-plant" class="central-wind"><circle class="ground-point" cx="500" cy="1000" r="3.5" fill="#547b47"/><path id="central-stem" class="stem" d="M500 1012 C493 876 518 752 497 631 C486 554 500 485 504 417" stroke="url(#stemLight)" stroke-width="12"/>
<g id="central-leaves"><path class="leaf" d="M498 846 C444 821 397 742 405 646 C468 697 493 778 498 846 Z" fill="url(#leafLight)"/><path class="leaf" d="M505 776 C553 737 602 664 603 574 C542 620 512 698 505 776 Z" fill="url(#leafLight)"/><path class="leaf" d="M497 692 C456 663 430 608 438 541 C482 578 498 635 497 692 Z" fill="url(#leafLight)" opacity=".92"/><path class="leaf" d="M505 630 C539 598 561 548 553 494 C516 532 505 582 505 630 Z" fill="url(#leafLight)" opacity=".88"/></g>
<g id="central-bloom" transform="translate(504 430)" filter="url(#softShadow)"><path class="petal rear" d="M0 5 C-79 -18 -93 -105 -57 -153 C-27 -132 -7 -80 0 5 Z" fill="url(#goldEdge)"/><path class="petal rear" d="M-1 5 C74 -20 93 -106 57 -153 C27 -129 7 -78 -1 5 Z" fill="url(#redGold)"/><path class="petal mid" d="M-2 8 C-73 -13 -73 -111 -25 -169 C8 -120 13 -55 -2 8 Z" fill="url(#redDeep)"/><path class="petal mid" d="M1 8 C69 -20 74 -112 29 -169 C-6 -119 -11 -55 1 8 Z" fill="url(#goldEdge)"/><path class="petal front" d="M0 10 C-48 -15 -53 -105 1 -176 C55 -105 49 -15 0 10 Z" fill="url(#redGold)"/><path d="M-11 -150 C-2 -162 5 -165 14 -153" fill="none" stroke="#ffd47a" stroke-width="2.4" opacity=".65" filter="url(#softLight)"/></g></g><g id="foreground-flowers"></g></svg><span id="status" class="visually-hidden" aria-live="polite"></span></section>
</main>
<script>
(()=>{const enter=document.getElementById('enter'),apology=document.getElementById('apology'),garden=document.getElementById('garden'),svg=document.getElementById('garden-svg'),central=document.getElementById('central-plant'),stem=document.getElementById('central-stem'),leaves=[...document.querySelectorAll('#central-leaves .leaf')],bloom=document.getElementById('central-bloom'),petals=[...bloom.querySelectorAll('.petal')],status=document.getElementById('status'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg';let started=false;
const el=(name,attrs={})=>{const n=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n},animate=(node,frames,options)=>node.animate(frames,{fill:'forwards',...options}).finished.catch(()=>{}),pause=duration=>animate(svg,[{opacity:1},{opacity:1}],{duration:reduced?1:duration});
function prep(){const len=stem.getTotalLength();stem.style.strokeDasharray=len;stem.style.strokeDashoffset=len;leaves.forEach(l=>{l.style.opacity=0;l.style.transform='scale(.03) rotate(-5deg)'});bloom.style.opacity=0;bloom.style.transform+=' scale(.08) translateY(22px)';petals.forEach(p=>{p.style.opacity=.15;p.style.transform='scale(.22,.08)'})}
const palettes={red:['url(#redGold)','url(#redDeep)','url(#goldEdge)'],pink:['url(#pinkPetal)','url(#pinkPale)','url(#pinkPetal)']};
function makeFlower(d,i){const outer=el('g',{transform:`translate(${d.x} 1015) scale(${d.scale})`,opacity:'0'});outer.dataset.depth=d.depth;const wind=el('g',{class:'extra-wind'});wind.style.setProperty('--wind-time',`${6.1+i%6*.63}s`);wind.style.setProperty('--wind-delay',`${-(i%8)*.47}s`);wind.style.setProperty('--sway',`${.65+i%4*.24}deg`);wind.style.setProperty('--sway-neg',`${-.55-i%3*.2}deg`);const bend=d.bend,path=el('path',{class:'stem extra-stem',d:`M0 0 C${bend*-.25} ${-d.h*.34} ${bend} ${-d.h*.72} ${bend*.58} ${-d.h}`,'stroke':'url(#stemLight)','stroke-width':7/d.scale});wind.append(path);
const leafA=el('path',{class:'leaf extra-leaf',d:`M${bend*.15} ${-d.h*.38} C${-58/d.scale} ${-d.h*.45} ${-61/d.scale} ${-d.h*.67} ${-46/d.scale} ${-d.h*.75} C${-10/d.scale} ${-d.h*.58} ${bend*.15} ${-d.h*.43} ${bend*.15} ${-d.h*.38}Z`,fill:'url(#leafLight)',opacity:'.86'});leafA.style.setProperty('--leaf-time',`${5.4+i%5}s`);const leafB=el('path',{class:'leaf extra-leaf',d:`M${bend*.35} ${-d.h*.57} C${58/d.scale} ${-d.h*.64} ${65/d.scale} ${-d.h*.82} ${48/d.scale} ${-d.h*.88} C${14/d.scale} ${-d.h*.73} ${bend*.35} ${-d.h*.61} ${bend*.35} ${-d.h*.57}Z`,fill:'url(#leafLight)',opacity:'.78'});leafB.style.setProperty('--leaf-time',`${6.2+i%4}s`);wind.append(leafA,leafB);
const head=el('g',{class:'extra-head',transform:`translate(${bend*.58} ${-d.h-4}) rotate(${d.tilt})`}),fills=palettes[d.color],o=d.open,shapes=[`M0 5 C${-34-o*15} -5 ${-43-o*9} -76 -23 -101 C-5 -73 3 -31 0 5Z`,`M0 5 C${34+o*15} -5 ${43+o*9} -76 23 -101 C5 -73 -3 -31 0 5Z`,'M0 7 C-30 -9 -31 -75 0 -116 C31 -75 30 -9 0 7Z'];shapes.forEach((s,j)=>head.append(el('path',{class:'petal extra-petal',d:s,fill:fills[j],opacity:j===2?'.98':'.9'})));wind.append(head);outer.append(wind);return{outer,path,leaves:[leafA,leafB],head}}
function build(){const back=document.getElementById('background-flowers'),front=document.getElementById('foreground-flowers'),count=innerWidth>=700?32:19;const data=[];for(let i=0;i<count;i++){const lane=i*379%997,depth=i%3;data.push({x:Math.max(18,Math.min(982,lane+(Math.abs(lane-500)<62?(lane<500?-72:72):0))),h:235+i*83%330-depth*34,scale:.52+i*37%46/100-depth*.06,bend:-24+i*29%49,tilt:-10+i*17%21,color:i%5===0||i%5===3?'red':'pink',open:i%4/3,depth})}return data.sort((a,b)=>b.depth-a.depth).map((d,i)=>{const f=makeFlower(d,i);(d.depth?back:front).append(f.outer);return f})}
let flowers=[];
async function growCentral(){status.textContent='A tulip begins to grow.';const point=central.querySelector('.ground-point');await animate(point,[{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1.7)'},{opacity:.7,transform:'scale(1)'}],{duration:reduced?1:650,easing:'ease-out'});await animate(stem,[{strokeDashoffset:stem.style.strokeDashoffset},{strokeDashoffset:0}],{duration:reduced?1:2600,easing:'cubic-bezier(.42,0,.25,1)'});for(const leaf of leaves)await animate(leaf,[{opacity:0,transform:'scale(.03) rotate(-7deg)'},{opacity:1,transform:'scale(.72,1.03) rotate(2deg)',offset:.72},{opacity:1,transform:'scale(1) rotate(0)'}],{duration:reduced?1:740,easing:'cubic-bezier(.2,.72,.24,1)'});bloom.style.opacity=1;await animate(bloom,[{opacity:.2,transform:'translate(504px,430px) scale(.08) translateY(22px)'},{opacity:1,transform:'translate(504px,430px) scale(.38,.68) translateY(7px)'},{opacity:1,transform:'translate(504px,430px) scale(1)'}],{duration:reduced?1:1200,easing:'cubic-bezier(.16,.66,.24,1)'});for(const [i,p] of petals.entries())await animate(p,[{opacity:.2,transform:`scale(.35,.12) rotate(${i%2?-3:3}deg)`},{opacity:1,transform:`scale(.9,1.04) rotate(${i%2?1:-1}deg)`},{opacity:1,transform:'scale(1)'}],{duration:reduced?1:470,easing:'cubic-bezier(.2,.7,.25,1)'});status.textContent='The first red and gold tulip has bloomed.'}
async function growGarden(){await pause(900);status.textContent='More tulips are growing around it.';const batches=reduced?[flowers]:Array.from({length:Math.ceil(flowers.length/4)},(_,i)=>flowers.slice(i*4,i*4+4));for(const batch of batches)await Promise.all(batch.map(async(f,slot)=>{const len=f.path.getTotalLength();f.path.style.strokeDasharray=len;f.path.style.strokeDashoffset=len;f.leaves.forEach(l=>{l.style.opacity=0;l.style.transform='scale(.04)'});f.head.style.opacity=0;if(!reduced&&slot)await pause(slot*105);await Promise.all([animate(f.outer,[{opacity:0},{opacity:f.outer.dataset.depth==='2'?.44:f.outer.dataset.depth==='1'?.67:.94}],{duration:reduced?1:620,easing:'ease-out'}),animate(f.path,[{strokeDashoffset:len},{strokeDashoffset:0}],{duration:reduced?1:1150,easing:'cubic-bezier(.4,0,.25,1)'})]);await Promise.all(f.leaves.map((l,i)=>animate(l,[{opacity:0,transform:`scale(.05) rotate(${i?-5:5}deg)`},{opacity:.82,transform:'scale(1) rotate(0)'}],{duration:reduced?1:520+i*100,easing:'cubic-bezier(.2,.7,.25,1)'})));const tr=f.head.getAttribute('transform');await animate(f.head,[{opacity:0,transform:tr+' scale(.12,.06)'},{opacity:1,transform:tr+' scale(.7,1.04)'},{opacity:1,transform:tr+' scale(1)'}],{duration:reduced?1:790,easing:'cubic-bezier(.2,.72,.2,1)'})}));garden.classList.add('garden-alive');status.textContent='The tulip garden is in bloom, moving in a gentle breeze.'}
async function begin(){if(started)return;started=true;enter.disabled=true;apology.classList.add('leaving');garden.classList.add('visible');garden.setAttribute('aria-hidden','false');await Promise.all([animate(apology,[{opacity:1},{opacity:0}],{duration:reduced?1:1400,easing:'cubic-bezier(.55,0,.3,1)'}),animate(garden,[{opacity:0,transform:'translateY(4vh) scale(1.015)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:reduced?1:1750,easing:'cubic-bezier(.2,.65,.25,1)'})]);apology.hidden=true;await growCentral();await growGarden()}
flowers=build();prep();enter.addEventListener('click',begin,{once:true});
})();
</script>
</body>
</html>
